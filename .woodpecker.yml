when:
  - event: tag
    ref: refs/tags/*.*.*

variables:
  - &mise_image jdxcode/mise:2026.9.1

steps:
  - name: test
    image: *mise_image
    environment:
      MISE_YES: "1"
    commands:
      - mise install
      - mise exec -- go vet ./...
      - mise exec -- go test ./...

  - name: build
    image: *mise_image
    environment:
      MISE_YES: "1"
    commands:
      - mise install
      - mise run build --all --version "$CI_COMMIT_TAG"
      - mise run formula --version "$CI_COMMIT_TAG"
      - ls -l build/dist

  - name: release
    image: woodpeckerci/plugin-release:0.3.1
    settings:
      api_key:
        from_secret: forgejo_token
      base_url: ${CI_FORGE_URL}
      files: build/dist/*
      title: ${CI_COMMIT_TAG}
      note: |
        lazymux ${CI_COMMIT_TAG}

        Binaries for darwin, linux and windows on amd64 and arm64, plus
        SHA256SUMS for `sha256sum -c`.

  # This repo is its own Homebrew tap, so the formula the release just made
  # valid is committed straight back to main. Only tags run this pipeline, so
  # the push cannot trigger another build.
  - name: bump-formula
    image: alpine/git:2.54.0
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
      GIT_AUTHOR_NAME: woodpecker
      GIT_AUTHOR_EMAIL: woodpecker@fj.ktbcloud.com
      GIT_COMMITTER_NAME: woodpecker
      GIT_COMMITTER_EMAIL: woodpecker@fj.ktbcloud.com
    commands:
      - cp Formula/lazymux.rb /tmp/lazymux.rb
      - git fetch --depth=1 origin main
      - git checkout -B bump-formula FETCH_HEAD
      - cp /tmp/lazymux.rb Formula/lazymux.rb
      - git add Formula/lazymux.rb
      - git diff --cached --quiet && echo "formula already current" && exit 0
      - git commit -m "Bump the Homebrew formula to $CI_COMMIT_TAG"
      - git push "$(echo "$CI_FORGE_URL" | sed -e "s|://|://oauth2:$FORGEJO_TOKEN@|")/$CI_REPO.git" HEAD:refs/heads/main
