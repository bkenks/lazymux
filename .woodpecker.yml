when:
  - event: [push, pull_request]
  - event: tag
    ref: refs/tags/v*

variables:
  - &mise_image jdxcode/mise:2026.9.1
  - &release_tag
    event: tag
    ref: refs/tags/v*

steps:
  - name: check
    image: *mise_image
    environment:
      MISE_YES: "1"
    commands:
      - mise install
      - mise run check

  - name: build
    image: *mise_image
    environment:
      MISE_YES: "1"
    commands:
      - mise install
      - mise run build --all --version "$CI_COMMIT_TAG"
      - cd build/dist && sha256sum -c SHA256SUMS
    when:
      - *release_tag

  - name: release
    image: woodpeckerci/plugin-release:0.3.1
    settings:
      api_key:
        from_secret: forgejo_token
      base_url: ${CI_FORGE_URL}
      files: build/dist/*
      title: ${CI_COMMIT_TAG}
      note: |
        lazymux ${CI_COMMIT_TAG}

        Binaries for darwin, linux and windows on amd64 and arm64, plus
        SHA256SUMS for `sha256sum -c`.
    when:
      - *release_tag
